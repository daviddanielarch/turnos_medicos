permissions:
  contents: read
name: Frontend Web

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/allende/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mobile/allende/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      run_deploy_frontend:
        description: 'Deploy web frontend'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/allende
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: mobile/allende/package-lock.json
    - run: npm ci
    - run: npx expo export --platform web --output-dir dist
      env:
        CI: 1

  deploy-frontend:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_deploy_frontend) }}
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - run: railway up mobile/allende --path-as-root --service=turnos-medicos-web --ci
